spring.application.name=api-gateway

server.port=8080


management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

info.app.name=EduCheck AI API Gateway
info.app.description=Entry point for EduCheck AI microservices

#routing to classroom services

spring.cloud.gateway.server.webmvc.routes[0].id=classroom-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/classrooms/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1


#Router to assignnment service
spring.cloud.gateway.server.webmvc.routes[1].id=assignment-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/assignments/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1