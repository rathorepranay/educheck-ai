spring.application.name=classroom-service

server.port=8081

#Postgres configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/educheck_classroom
spring.datasource.username=educheck
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

info.app.name=EduCheck AI Classroom Service
info.app.description=Manages classrooms and assignments

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.format_sql=true







